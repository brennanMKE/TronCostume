<title>Carrier / back cover — acrylic 3 mm</title><desc>Cut. Full annulus OD 260 / ID 120. 3 x 4.5 countersunk at R80 into the frame's back inserts. 1.8 x 82 slot takes the button protoboard on edge. 3.2 holes are M3 standoffs for the three boards and the battery holder. Build the whole electronics pack on this off the disc, then screw it on.</desc>
