<text x="52.00" y="680.80" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="700" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">SO, TO ANSWER BOTH QUESTIONS</text>
<text x="52.00" y="704.80" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">The LED strips never share space with the electronics. The strips stand on edge in the</text>
<text x="52.00" y="722.80" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">9 mm channel layer, between R79 and R110, in the top 12 mm of the disc. The boards, the</text>
<text x="52.00" y="740.80" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">battery and the button board all sit in the 24 mm frame below the divider, between R72</text>
<text x="52.00" y="758.80" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">and R110. The divider is the floor of one and the ceiling of the other.</text>
<text x="52.00" y="776.80" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"></text>
<text x="52.00" y="794.80" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Total 42 mm. The 18650 holder is what sets it: 21 mm tall, in a 24 mm bay, 3 mm clear.</text>
<text x="52.00" y="812.80" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Drop to a bare tabbed cell and an 18 mm frame and the disc becomes 36 mm.</text>
<text x="52.00" y="878.00" font-size="10.5" fill="#8a9099" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">build-plans/render/stack_section.py  ·  same constants as the v4 cut files</text>
