<text x="398.00" y="842.00" font-size="11.5" fill="#c0392b" text-anchor="end" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">5 V USB battery bank</text>
<path d="M 630,830 L 726,830 L 726,744 L 470,744 L 470,760" fill="none" stroke="#1f6fb4" stroke-width="3"/>
<circle cx="470" cy="760" r="7" fill="#1f6fb4"/>
