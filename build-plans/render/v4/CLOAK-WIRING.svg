<text x="960.00" y="150.00" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="700" letter-spacing="1.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">CONNECTIONS</text>
<rect x="960" y="164" width="8" height="8" fill="#c0392b"/>
<text x="976.00" y="178.00" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="700" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">ESP32-C3 USB-C</text>
<text x="1110.00" y="178.00" font-size="12.5" fill="#5a6066" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">5 V USB battery bank — the only supply</text>
<rect x="960" y="189" width="8" height="8" fill="#1f6fb4"/>
<text x="976.00" y="203.00" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="700" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">ESP32-C3 GPIO 4</text>
<text x="1110.00" y="203.00" font-size="12.5" fill="#5a6066" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">330 Ω  →  strip DIN</text>
<rect x="960" y="214" width="8" height="8" fill="#c0392b"/>
<text x="976.00" y="228.00" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="700" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">ESP32-C3 5V pin</text>
<text x="1110.00" y="228.00" font-size="12.5" fill="#5a6066" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">strip +5 V</text>
<rect x="960" y="239" width="8" height="8" fill="#2f3437"/>
<text x="976.00" y="253.00" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="700" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">ESP32-C3 GND</text>
<text x="1110.00" y="253.00" font-size="12.5" fill="#5a6066" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">strip GND</text>
<text x="960.00" y="300.00" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="700" letter-spacing="1.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">CHAIN ORDER</text>
<text x="960.00" y="326.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Data runs 1 → 2 → 3 → 4 → 5. Each segment's DOUT</text>
<text x="960.00" y="344.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">goes to the next segment's DIN. +5 V and GND run</text>
<text x="960.00" y="362.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">to every segment in parallel, never daisy-chained</text>
<text x="960.00" y="380.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">through the data line.</text>
<text x="960.00" y="398.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"></text>
<text x="960.00" y="416.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Set MAIN_LEDS in include/config.h to the TOTAL of</text>
<text x="960.00" y="434.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">all five segments. It is 30 right now — a</text>
<text x="960.00" y="452.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">placeholder. Count your strip and change it.</text>
<text x="960.00" y="470.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"></text>
<text x="960.00" y="488.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">All strip current goes through the C3's USB-C and</text>
<text x="960.00" y="506.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">its 5 V pin. Fine up to roughly 1 A. Past that,</text>
<text x="960.00" y="524.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">feed the strip straight off the bank with a cut</text>
<text x="960.00" y="542.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">USB cable and only share the ground.</text>
<text x="960.00" y="560.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"></text>
<text x="960.00" y="578.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">config.h expects a wake button on GPIO 5. No</text>
<text x="960.00" y="596.00" font-size="12.5" fill="#434a52" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">button is fine — the cloak just never sleeps.</text>
<text x="44.00" y="914.00" font-size="11" fill="#8a9099" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">build-plans/render/cloak_wiring.py  ·  pins read from include/config.h (LED_PIN 4, WAKE_PIN 5, LED_POWER_PIN 20)</text>
</svg>
