<text x="26.00" y="545.00" font-size="3.8" fill="#2e7d4f" text-anchor="start" font-weight="700" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Front and back inserts can never meet.</text>
<text x="26.00" y="549.30" font-size="3.3" fill="#444" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">R102 at z 16–26 against R80 at z 30–40: 22 mm apart radially and 4 mm apart in z.</text>
<text x="26.00" y="555.40" font-size="3.8" fill="#c0392b" text-anchor="start" font-weight="700" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">The tightest z clearance in the build is 3 mm.</text>
<text x="26.00" y="559.70" font-size="3.3" fill="#444" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">The cover insert runs radially at mid-height, z 25–31, and crosses R70 in plan. The wire</text>
<text x="26.00" y="563.60" font-size="3.3" fill="#444" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">groove is z 34–40. They miss by 3 mm, and only because the groove is cut from the back.</text>
<text x="26.00" y="567.50" font-size="3.3" fill="#444" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Cut the groove deeper than 6 and they collide. Neither section plane shows this — it</text>
<text x="26.00" y="571.40" font-size="3.3" fill="#444" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">happens at the shoulders, bay x = ±28 and ±31.</text>
<text x="26.00" y="577.50" font-size="3.8" fill="#8a8a8a" text-anchor="start" font-weight="700" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">The LED channels sit entirely above the frame.</text>
<text x="26.00" y="581.80" font-size="3.3" fill="#444" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">C channel R79–93 and outer channel R110–118 live in the upper frame at z 3–13. The pockets</text>
<text x="26.00" y="585.70" font-size="3.3" fill="#444" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">below reach R84 and R94. They share radius but never share z — the floor at z 13–16 divides</text>
<text x="26.00" y="589.60" font-size="3.3" fill="#444" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">them, which is also the light barrier.</text>
<text x="26.00" y="595.70" font-size="3.8" fill="#c0392b" text-anchor="start" font-weight="700" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">The floor is the only thing bridging a pocket.</text>
<text x="26.00" y="600.00" font-size="3.3" fill="#444" text-anchor="start" font-weight="400" letter-spacing="0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">Section A shows it unsupported from R60 to R84. 3 mm acrylic, SF 2.9. See sheet 1.</text>
