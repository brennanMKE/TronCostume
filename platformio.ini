; One code base, four boards: two costumes, each with a disc and a cloak.
; Each env sets two constants:
;
;   COSTUME_ID   which costume (1 or 2). Boards only talk to their own costume.
;   DEVICE_ROLE  ROLE_DISC or ROLE_CLOAK.
;
;   pio run -e disc-1  -t upload --upload-port /dev/cu.usbmodemA
;   pio run -e cloak-1 -t upload --upload-port /dev/cu.usbmodemB
;   pio device monitor --port /dev/cu.usbmodemA
;
; Always pass -e when uploading. default_envs is disc-1 only so a bare
; `pio run -t upload` can't flash every image to the same port in turn.

[common]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    fastled/FastLED@3.10.3   ; newer releases fail to build on espressif32 6.x (Arduino core 2.x)

[env:disc-1]
extends = common
build_flags =
    ${common.build_flags}
    -DCOSTUME_ID=1
    -DDEVICE_ROLE=ROLE_DISC

[env:cloak-1]
extends = common
build_flags =
    ${common.build_flags}
    -DCOSTUME_ID=1
    -DDEVICE_ROLE=ROLE_CLOAK

[env:disc-2]
extends = common
build_flags =
    ${common.build_flags}
    -DCOSTUME_ID=2
    -DDEVICE_ROLE=ROLE_DISC

[env:cloak-2]
extends = common
build_flags =
    ${common.build_flags}
    -DCOSTUME_ID=2
    -DDEVICE_ROLE=ROLE_CLOAK

[platformio]
default_envs = disc-1
